[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-forecasting"
version = "1.0.0"
description = "Exact-hour air quality forecasting with a reproducible offline pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.6.1",
  "matplotlib==3.10.3", "joblib==1.5.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
