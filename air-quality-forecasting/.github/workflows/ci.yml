name: Test and offline container smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate checked-in static CSV
        run: python -m air_quality validate --config config.json
      - name: Test contracts and synthetic reproducibility
        run: python -m pytest -q
      - name: Build image
        run: docker build -t air-quality-forecasting:ci .
      - name: Smoke test without network access
        run: docker run --rm --network none air-quality-forecasting:ci python -m air_quality smoke
